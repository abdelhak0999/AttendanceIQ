<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendanceIQ | Employés</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script>if(!localStorage.getItem("token")){window.location.href="login.html";}</script>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="logo-container">
                <i class="ri-fingerprint-line logo-icon"></i>
                <h2>AttendanceIQ</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ri-dashboard-line"></i> <span>Tableau de bord</span></a>
                <a href="employees.html" class="nav-item active"><i class="ri-team-line"></i> <span>Employés</span></a>
                <a href="absences.html" class="nav-item"><i class="ri-calendar-check-line"></i> <span>Absences</span></a>
                <a href="reports.html" class="nav-item"><i class="ri-file-chart-line"></i> <span>Rapports</span></a>
                <div class="nav-section-title" style="padding: 20px 24px 10px; color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: bold;">Administration</div>
                <a href="holidays.html" class="nav-item"><i class="ri-calendar-event-line"></i> <span>Jours Fériés</span></a>
                <a href="leaves.html" class="nav-item"><i class="ri-calendar-todo-line"></i> <span>Congés</span></a>
                <a href="shifts.html" class="nav-item"><i class="ri-time-line"></i> <span>Horaires (Shifts)</span></a>
                <a href="settings.html" class="nav-item"><i class="ri-settings-3-line"></i> <span>Configuration</span></a>
            </nav>
<div style="padding:24px;margin-top:auto;"><button onclick="logout()" class="btn-secondary" style="width:100%;"><i class="ri-logout-box-line"></i> Déconnexion</button></div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h1>Annuaire des employés</h1>
                    <p id="emp-count">Chargement...</p>
                </div>
            </header>

            <section class="data-section">
                <div class="section-header">
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap: wrap;">
                        <input type="text" id="search-input" placeholder="Rechercher par nom ou matricule..." style="width:260px;" oninput="loadEmployees()">
                        <select id="dept-filter" style="width:180px;" onchange="loadEmployees()">
                            <option value="">Tous les départements</option>
                        </select>

                        <!-- Filtre Tout / Actifs / Inactifs -->
                        <div class="status-tabs" style="display:flex; border:1px solid var(--border-color); border-radius:8px; overflow:hidden;">
                            <button type="button" class="status-tab-btn active" data-status="active" onclick="setStatusFilter('active')" style="padding:8px 14px; border:none; background:var(--primary-color); color:white; cursor:pointer; font-size:13px;">Actifs</button>
                            <button type="button" class="status-tab-btn" data-status="inactive" onclick="setStatusFilter('inactive')" style="padding:8px 14px; border:none; background:#f1f5f9; color:#334155; cursor:pointer; font-size:13px;">Inactifs</button>
                            <button type="button" class="status-tab-btn" data-status="all" onclick="setStatusFilter('all')" style="padding:8px 14px; border:none; background:#f1f5f9; color:#334155; cursor:pointer; font-size:13px;">Tout</button>
                        </div>

                        <button class="btn-primary" onclick="document.getElementById('excel-input').click()">
                            <i class="ri-file-excel-2-line"></i> Importer Excel
                        </button>
                        <button class="btn-secondary" onclick="document.getElementById('inactive-input').click()" style="border-color:#f59e0b; color:#f59e0b;">
                            <i class="ri-upload-cloud-2-line"></i> Importer Inactifs
                        </button>
                        <button class="btn-secondary" onclick="exportInactives()" style="border-color: var(--danger); color: var(--danger);">
                            <i class="ri-download-cloud-2-line"></i> Exporter Inactifs
                        </button>
                        <input type="file" id="excel-input" style="display:none" accept=".xlsx, .xls" onchange="importExcel(this)">
                        <input type="file" id="inactive-input" style="display:none" accept=".xlsx, .xls" onchange="importInactive(this)">
                    </div>
                </div>

                <!-- Barre d'action en masse (visible seulement si au moins 1 employé coché) -->
                <div id="bulk-bar" style="display:none; align-items:center; gap:12px; padding:12px 16px; margin:0 0 16px 0; background:#eef2ff; border:1px solid #c7d2fe; border-radius:8px;">
                    <span id="bulk-count" style="font-weight:600; color:#3730a3;">0 employé(s) sélectionné(s)</span>
                    <label style="margin:0;">Assigner le shift :</label>
                    <select id="bulk-shift-select" style="width:200px;">
                        <option value="">-- Aucun (désassigner) --</option>
                    </select>
                    <button class="btn-primary" style="padding:8px 16px;" onclick="applyBulkShift()">
                        <i class="ri-check-line"></i> Appliquer
                    </button>
                    <button class="btn-secondary" style="padding:8px 16px;" onclick="clearSelection()">Annuler la sélection</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width:36px;"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this)"></th>
                                <th>Avatar</th>
                                <th>Matricule</th>
                                <th>Nom</th>
                                <th>Département</th>
                                <th>Horaire (Shift)</th>
                                <th>Actions</th>
                                <th>Historique</th>
                            </tr>
                        </thead>
                        <tbody id="emp-tbody">
                            <tr><td colspan="8" style="text-align:center;">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        let currentStatus = "active";
        let allShifts = [];
        const selectedIds = new Set();

        function getInitials(name) {
            if(!name) return "?";
            return name.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
        }

        function setStatusFilter(status) {
            currentStatus = status;
            document.querySelectorAll(".status-tab-btn").forEach(btn => {
                const isActive = btn.dataset.status === status;
                btn.style.background = isActive ? "var(--primary-color)" : "#f1f5f9";
                btn.style.color = isActive ? "white" : "#334155";
            });
            clearSelection();
            loadEmployees();
        }

        async function loadDepartments() {
            const res = await fetch(`${API}/employees/departments`);
            const depts = await res.json();
            const select = document.getElementById("dept-filter");
            select.innerHTML = '<option value="">Tous les départements</option>';
            depts.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        async function loadShiftsList() {
            const res = await fetch(`${API}/attendance/shifts/`);
            allShifts = await res.json();
            const bulkSelect = document.getElementById("bulk-shift-select");
            bulkSelect.innerHTML = '<option value="">-- Aucun (désassigner) --</option>' +
                allShifts.map(s => `<option value="${s.id}">${s.name} (${s.start}-${s.end})</option>`).join("");
        }

        function toggleSelectAll(checkbox) {
            document.querySelectorAll(".row-select").forEach(cb => {
                cb.checked = checkbox.checked;
                const id = parseInt(cb.dataset.id);
                if (checkbox.checked) selectedIds.add(id);
                else selectedIds.delete(id);
            });
            updateBulkBar();
        }

        function toggleRowSelect(checkbox, id) {
            if (checkbox.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            updateBulkBar();
        }

        function clearSelection() {
            selectedIds.clear();
            document.querySelectorAll(".row-select").forEach(cb => cb.checked = false);
            const selectAll = document.getElementById("select-all");
            if (selectAll) selectAll.checked = false;
            updateBulkBar();
        }

        function updateBulkBar() {
            const bar = document.getElementById("bulk-bar");
            const count = selectedIds.size;
            document.getElementById("bulk-count").textContent = `${count} employé(s) sélectionné(s)`;
            bar.style.display = count > 0 ? "flex" : "none";
        }

        async function applyBulkShift() {
            if (selectedIds.size === 0) return;
            const shiftVal = document.getElementById("bulk-shift-select").value;
            const shift_id = shiftVal === "" ? null : parseInt(shiftVal);
            try {
                const res = await fetch(`${API}/employees/bulk-assign-shift`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ employee_ids: Array.from(selectedIds), shift_id })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ Shift appliqué à ${data.updated} employé(s)`);
                    clearSelection();
                    loadEmployees();
                } else {
                    alert(`❌ Erreur: ${data.detail || "erreur inconnue"}`);
                }
            } catch (e) {
                alert("❌ Erreur de connexion au serveur");
            }
        }

        async function loadEmployees() {
            const search = document.getElementById("search-input").value;
            const dept = document.getElementById("dept-filter").value;

            let url = `${API}/employees/?status=${currentStatus}`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (dept) url += `&department=${encodeURIComponent(dept)}`;

            const res = await fetch(url);
            const employees = await res.json();

            document.getElementById("emp-count").textContent = `${employees.length} employés`;

            if (allShifts.length === 0) await loadShiftsList();

            const tbody = document.getElementById("emp-tbody");
            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Aucun employé trouvé</td></tr>';
                return;
            }

            tbody.innerHTML = employees.map(e => {
                const rowStyle = e.is_active ? '' : 'style="opacity: 0.6; background-color: #f8fafc;"';
                const shiftDropdown = `<select onchange="updateShift(${e.id}, this.value)" style="padding:4px; border-radius:4px; border:1px solid var(--border-color);" ${!e.is_active ? 'disabled' : ''}>
                    <option value="">-- Aucun --</option>
                    ${allShifts.map(s => `<option value="${s.id}" ${e.shift_id == s.id ? 'selected' : ''}>${s.name} (${s.start}-${s.end})</option>`).join("")}
                </select>`;

                return `
                <tr ${rowStyle}>
                    <td><input type="checkbox" class="row-select" data-id="${e.id}" ${selectedIds.has(e.id) ? 'checked' : ''} onchange="toggleRowSelect(this, ${e.id})"></td>
                    <td><div class="avatar">${getInitials(e.name)}</div></td>
                    <td><strong>${e.matricule || '-'}</strong></td>
                    <td>${e.name} ${!e.is_active ? '<span class="badge badge-danger" style="margin-left:8px;">Inactif</span>' : ''}</td>
                    <td>${e.department || '-'}</td>
                    <td>${shiftDropdown}</td>
                    <td>
                        <button class="btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="toggleEmployee(${e.id}, ${e.is_active})">
                            ${e.is_active ? '<i class="ri-ban-line"></i> Inactiver' : '<i class="ri-checkbox-circle-line"></i> Activer'}
                        </button>
                    </td>
                    <td>
                        <a href="historique.html?id=${e.id}" class="btn-secondary" style="padding:6px 12px; text-decoration:none;">
                            <i class="ri-history-line"></i>
                        </a>
                    </td>
                </tr>`;
            }).join("");

            updateBulkBar();
        }

        async function updateShift(id, shiftId) {
            await fetch(`${API}/employees/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shift_id: shiftId ? parseInt(shiftId) : null })
            });
        }

        async function exportInactives() {
            window.location.href = `${API}/employees/export-inactive`;
        }

        async function toggleEmployee(id, currentStatus) {
            const res = await fetch(`${API}/employees/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ is_active: !currentStatus })
            });
            if (res.ok) {
                loadEmployees();
            } else {
                alert("Erreur lors de la mise à jour");
            }
        }

        async function importExcel(input) {
            if (!input.files[0]) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);
            
            try {
                const res = await fetch(`${API}/import/excel`, {
                    method: "POST",
                    body: formData
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ Importation réussie !\n\n➕ ${data.added} nouveaux employés ajoutés\n🔄 ${data.updated} employés mis à jour`);
                    loadEmployees();
                } else {
                    alert(`❌ Erreur serveur: ${data.detail || "Erreur inconnue"}`);
                }
            } catch (e) {
                alert("❌ Erreur de connexion au serveur: " + e);
            } finally {
                input.value = "";
            }
        }

        async function importInactive(input) {
            if (!input.files[0]) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);

            try {
                const res = await fetch(`${API}/import/inactive`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                if (res.ok) {
                    let msg = `✅ Importation terminée !\n\n🚫 ${data.updated} employé(s) marqué(s) comme inactifs`;
                    if (data.not_found && data.not_found.length > 0) {
                        msg += `\n⚠️ ${data.not_found.length} matricule(s) non trouvé(s) : ${data.not_found.slice(0, 10).join(", ")}${data.not_found.length > 10 ? "..." : ""}`;
                    }
                    alert(msg);
                    loadEmployees();
                } else {
                    alert(`❌ Erreur serveur: ${data.detail || "Erreur inconnue"}`);
                }
            } catch (e) {
                alert("❌ Erreur de connexion au serveur: " + e);
            } finally {
                input.value = "";
            }
        }

        function logout(){localStorage.removeItem("token");window.location.href="login.html";}

        loadDepartments();
        loadShiftsList().then(loadEmployees);
    </script>
</body>
</html>
