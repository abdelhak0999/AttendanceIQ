<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendanceIQ | Gestion des Congés</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script>if(!localStorage.getItem("token")){window.location.href="login.html";}</script>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="logo-container">
                <i class="ri-fingerprint-line logo-icon"></i>
                <h2>AttendanceIQ</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ri-dashboard-line"></i> <span>Tableau de bord</span></a>
                <a href="employees.html" class="nav-item"><i class="ri-team-line"></i> <span>Employés</span></a>
                <a href="absences.html" class="nav-item"><i class="ri-calendar-check-line"></i> <span>Absences</span></a>
                <a href="reports.html" class="nav-item"><i class="ri-file-chart-line"></i> <span>Rapports</span></a>
                <div class="nav-section-title" style="padding: 20px 24px 10px; color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: bold;">Administration</div>
                <a href="holidays.html" class="nav-item"><i class="ri-calendar-event-line"></i> <span>Jours Fériés</span></a>
                <a href="leaves.html" class="nav-item active"><i class="ri-calendar-todo-line"></i> <span>Congés</span></a>
                <a href="settings.html" class="nav-item"><i class="ri-settings-3-line"></i> <span>Configuration</span></a>
            </nav>
            <div style="padding:24px;margin-top:auto;"><button onclick="logout()" class="btn-secondary" style="width:100%;"><i class="ri-logout-box-line"></i> Déconnexion</button></div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h1>Gestion des Congés</h1>
                    <p>Déclarez les absences autorisées (Congés, Maladie, etc.)</p>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" onclick="openModal()">
                        <i class="ri-add-line"></i> Ajouter un congé
                    </button>
                </div>
            </header>

            <section class="data-section">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employé</th>
                                <th>Date Début</th>
                                <th>Date Fin</th>
                                <th>Type</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="leaves-tbody">
                            <tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:32px; border-radius:12px; width:400px;">
            <h3>Ajouter un congé</h3><br>
            <div class="form-group">
                <label>Employé</label>
                <select id="l-employee"></select>
            </div>
            <div class="form-group">
                <label>Date Début</label>
                <input type="date" id="l-start">
            </div>
            <div class="form-group">
                <label>Date Fin</label>
                <input type="date" id="l-end">
            </div>
            <div class="form-group">
                <label>Type de congé</label>
                <select id="l-type">
                    <option value="Congé Annuel">Congé Annuel</option>
                    <option value="Maladie">Maladie</option>
                    <option value="Maternité">Maternité</option>
                    <option value="Récupération">Récupération</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn-primary" onclick="saveLeave()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function loadEmployees() {
            const res = await fetch(`${API}/employees/`);
            const emps = await res.json();
            document.getElementById('l-employee').innerHTML = emps.map(e => `<option value="${e.id}">${e.name} (${e.matricule})</option>`).join("");
        }

        async function loadLeaves() {
            const res = await fetch(`${API}/leaves/`);
            const leaves = await res.json();
            const tbody = document.getElementById("leaves-tbody");
            if (leaves.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Aucun congé enregistré</td></tr>';
                return;
            }
            tbody.innerHTML = leaves.map(l => `
                <tr>
                    <td><strong>${l.employee_name}</strong></td>
                    <td>${l.start}</td>
                    <td>${l.end}</td>
                    <td><span class="badge badge-success">${l.type}</span></td>
                    <td><button class="btn-secondary" style="color:var(--danger); border-color:var(--danger);" onclick="deleteLeave(${l.id})"><i class="ri-delete-bin-line"></i></button></td>
                </tr>
            `).join("");
        }

        async function saveLeave() {
            const employee_id = document.getElementById('l-employee').value;
            const start_date = document.getElementById('l-start').value;
            const end_date = document.getElementById('l-end').value;
            const leave_type = document.getElementById('l-type').value;
            if(!employee_id || !start_date || !end_date) return alert("Veuillez remplir tous les champs");
            
            await fetch(`${API}/leaves/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ employee_id, start_date, end_date, leave_type })
            });
            closeModal();
            loadLeaves();
        }

        function logout(){ localStorage.clear(); window.location.href="login.html"; }
        loadEmployees();
        loadLeaves();
    </script>
</body>
</html>
