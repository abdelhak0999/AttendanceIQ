<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendanceIQ | Connexion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .login-header {
            margin-bottom: 32px;
        }
        .login-header i {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 16px;
            display: block;
        }
        .login-header h2 {
            font-size: 24px;
            color: var(--text-main);
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="ri-fingerprint-fill"></i>
            <h2>AttendanceIQ</h2>
            <p style="color: var(--text-muted);">Connectez-vous pour gérer les présences</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary btn-login">Se connecter</button>
        </form>
        <div id="error-msg" style="color: var(--danger); margin-top: 16px; font-size: 14px; display: none;"></div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("role", data.role);
                    window.location.href = "index.html";
                } else {
                    errorEl.textContent = "Identifiants incorrects";
                    errorEl.style.display = "block";
                }
            } catch (e) {
                errorEl.textContent = "Erreur de connexion au serveur";
                errorEl.style.display = "block";
            }
        };
    </script>
</body>
</html>
