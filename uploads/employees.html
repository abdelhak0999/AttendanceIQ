<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendanceIQ | Employés</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script>if(!localStorage.getItem("token")){window.location.href="login.html";}</script>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="logo-container">
                <i class="ri-fingerprint-line logo-icon"></i>
                <h2>AttendanceIQ</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="ri-dashboard-line"></i> <span>Tableau de bord</span></a>
                <a href="employees.html" class="nav-item active"><i class="ri-team-line"></i> <span>Employés</span></a>
                <a href="absences.html" class="nav-item"><i class="ri-calendar-check-line"></i> <span>Absences</span></a>
                <a href="reports.html" class="nav-item"><i class="ri-file-chart-line"></i> <span>Rapports</span></a>
                <div class="nav-section-title" style="padding: 20px 24px 10px; color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: bold;">Administration</div>
                <a href="holidays.html" class="nav-item"><i class="ri-calendar-event-line"></i> <span>Jours Fériés</span></a>
                <a href="leaves.html" class="nav-item"><i class="ri-calendar-todo-line"></i> <span>Congés</span></a>
                <a href="settings.html" class="nav-item"><i class="ri-settings-3-line"></i> <span>Configuration</span></a>
            </nav>
<div style="padding:24px;margin-top:auto;"><button onclick="logout()" class="btn-secondary" style="width:100%;"><i class="ri-logout-box-line"></i> Déconnexion</button></div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h1>Annuaire des employés</h1>
                    <p id="emp-count">Chargement...</p>
                </div>
            </header>

            <section class="data-section">
                <div class="section-header">
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap: wrap;">
                        <input type="text" id="search-input" placeholder="Rechercher par nom ou matricule..." style="width:300px;" oninput="loadEmployees()">
                        <select id="dept-filter" style="width:200px;" onchange="loadEmployees()">
                            <option value="">Tous les départements</option>
                        </select>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--text-muted);">
                            <input type="checkbox" id="inactive-filter" onchange="loadEmployees()"> Afficher les inactifs
                        </label>
                        <button class="btn-primary" onclick="document.getElementById('excel-input').click()">
                            <i class="ri-file-excel-2-line"></i> Importer Excel (.xls, .xlsx)
                        </button>
                        <input type="file" id="excel-input" style="display:none" accept=".xlsx, .xls" onchange="importExcel(this)">
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Avatar</th>
                                <th>Matricule</th>
                                <th>Nom</th>
                                <th>Département</th>
                                <th>Horaire (Shift)</th>
                                <th>Actions</th>
                                <th>Historique</th>
                            </tr>
                        </thead>
                        <tbody id="emp-tbody">
                            <tr><td colspan="7" style="text-align:center;">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        const STATUTS = {
            "a_l_heure":        '<span class="badge badge-success">À l\'heure</span>',
            "retard":           '<span class="badge badge-warning">Retard</span>',
            "pause_depassee":   '<span class="badge badge-warning">Pause dépassée</span>',
            "sortie_anticipee": '<span class="badge badge-danger">Sortie anticipée</span>',
            "anomalie":         '<span class="badge badge-danger">Anomalie</span>',
            "absent":           '<span class="badge badge-danger">Absent</span>',
            "present":          '<span class="badge badge-success">Présent</span>',
            "pending":          '<span class="badge" style="background:#f1f5f9;color:#64748b;">En attente</span>',
        };

        function getInitials(name) {
            if(!name) return "?";
            return name.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
        }

        async function loadDepartments() {
            const res = await fetch(`${API}/employees/departments`);
            const depts = await res.json();
            const select = document.getElementById("dept-filter");
            depts.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
        }

        async function loadEmployees() {
            const search = document.getElementById("search-input").value;
            const dept = document.getElementById("dept-filter").value;
            const includeInactive = document.getElementById("inactive-filter").checked;

            let url = `${API}/employees/?`;
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (dept) url += `department=${encodeURIComponent(dept)}&`;
            if (includeInactive) url += `include_inactive=true`;

            const res = await fetch(url);
            const employees = await res.json();

            document.getElementById("emp-count").textContent = `${employees.length} employés`;

            const tbody = document.getElementById("emp-tbody");
            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Aucun employé trouvé</td></tr>';
                return;
            }

            tbody.innerHTML = employees.map(e => {
                const rowStyle = e.is_active ? '' : 'style="opacity: 0.6; background-color: #f8fafc;"';
                return `
                <tr ${rowStyle}>
                    <td><div class="avatar">${getInitials(e.name)}</div></td>
                    <td><strong>${e.matricule || '-'}</strong></td>
                    <td>${e.name} ${!e.is_active ? '<span class="badge badge-danger" style="margin-left:8px;">Inactif</span>' : ''}</td>
                    <td>${e.department || '-'}</td>
                    <td>
                        <select onchange="updateShift(${e.id}, this.value)" style="padding:4px; border-radius:4px; border:1px solid var(--border-color);" ${!e.is_active ? 'disabled' : ''}>
                            <option value="morning" ${e.shift_type === 'morning' ? 'selected' : ''}>Matin (08-16)</option>
                            <option value="evening" ${e.shift_type === 'evening' ? 'selected' : ''}>Soir (16-00)</option>
                            <option value="night" ${e.shift_type === 'night' ? 'selected' : ''}>Nuit (00-08)</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="toggleEmployee(${e.id}, ${e.is_active})">
                            ${e.is_active ? '<i class="ri-ban-line"></i> Inactiver' : '<i class="ri-checkbox-circle-line"></i> Activer'}
                        </button>
                    </td>
                    <td>
                        <a href="historique.html?id=${e.id}" class="btn-secondary" style="padding:6px 12px; text-decoration:none;">
                            <i class="ri-history-line"></i>
                        </a>
                    </td>
                </tr>`;
            }).join("");
        }

        async function updateShift(id, shift) {
            await fetch(`${API}/employees/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shift_type: shift })
            });
        }

        async function toggleEmployee(id, currentStatus) {
            const res = await fetch(`${API}/employees/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ is_active: !currentStatus })
            });
            if (res.ok) {
                loadEmployees();
            } else {
                alert("Erreur lors de la mise à jour");
            }
        }

        async function importExcel(input) {
            if (!input.files[0]) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);
            
            try {
                const res = await fetch(`${API}/import/excel`, {
                    method: "POST",
                    body: formData
                });
                
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ Importation réussie !\n\n➕ ${data.added} nouveaux employés ajoutés\n🔄 ${data.updated} employés mis à jour`);
                    loadEmployees();
                } else {
                    alert(`❌ Erreur serveur: ${data.detail || "Erreur inconnue"}`);
                }
            } catch (e) {
                alert("❌ Erreur de connexion au serveur: " + e);
            }
        }

        loadDepartments();
        loadEmployees();
    </script>
<script>function logout(){localStorage.removeItem("token");window.location.href="login.html";}</script>
</body>
</html>
